<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C1C20"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#33333A" stroke-width="1.5"/>
  <!-- The "A" of Act, drawn as two decisive strokes -->
  <path d="M15 34L24 14L33 34" stroke="#F2F3F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
